name: Neo | Frontend
type: theme
description: 'An opinionated frontend theme.'
package: Neo
base theme: neo_base
version: 1.0.155
core_version_requirement: ^10.3 || ^11
libraries:
  - neo_front/global
neo:
  scope: front
  utilities:
    .page-title-spacing-t:
      'apply': '@apply pt-4 md:pt-6 lg:pt-14'
    .page-title-spacing-b:
      'apply': '@apply mb-4 md:mb-6 lg:mb-14'
regions:
  header: Header
  status: Status
  content: Content
  footer: Footer
libraries-override:
  content_moderation/content_moderation:
    css:
      component:
        css/content_moderation.module.css: false
      theme:
        css/content_moderation.theme.css: false
