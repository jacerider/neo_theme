name: Neo | Frontend
type: theme
description: 'An opinionated frontend theme.'
package: Neo
base theme: neo_base
version: 1.1.0
core_version_requirement: ^10.3 || ^11
libraries:
  - neo_front/global
neo:
  scope: front
regions:
  header: Header
  status: Status
  content: Content
  footer: Footer
libraries-override:
  content_moderation/content_moderation:
    css:
      component:
        css/content_moderation.module.css: false
      theme:
        css/content_moderation.theme.css: false
