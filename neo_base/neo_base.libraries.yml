    - core/once

tableheader:
  version: VERSION
  neo: true
  js:
    src/js/tableheader.ts: { minified: true }
  dependencies:
    # Load-bearing beyond this library. libraries-extend merges this definition
    # into core/drupal.tableheader, which is CSS-only in Drupal 11 and so has no
    # dependencies of its own to inherit — whatever is declared here is all the
    # merged library gets.
    - core/drupal
    - core/once

tabledrag:
  version: VERSION
  neo: true
  js:
    src/js/tabledrag.js: {}
  css:
    theme:
      src/css/tabledrag.css: { minified: true }
  dependencies:
    # Reached via libraries-extend on core/drupal.tabledrag, which happens to
    # load these first. State them anyway: the chunk is invoked with
    # (jQuery, Drupal) and calls once(), so it needs them however it is
    # attached.
    - core/jquery
    - core/drupal
    - core/once

