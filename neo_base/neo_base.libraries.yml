      src/css/_variants.css: { minified: true }

sticky:
  version: VERSION
  neo: true
  css: {}
  js:
    src/js/sticky.ts: { minified: true }
  dependencies:
    # Remove dependency as soon as drupal.display removes jquery.
    - core/jquery

displace:
  version: VERSION
  neo: true
  css: {}
  js:
    src/js/displace.ts: { minified: true }
  dependencies:
    # Remove dependency as soon as drupal.display removes jquery.
    - core/jquery
    - core/drupal
    - core/drupal.debounce

