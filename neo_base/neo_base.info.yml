name: Neo | Base
type: theme
description: 'An opinionated base theme of blessings.'
package: Neo
base theme: FALSE
version: 0.0.0
core_version_requirement: ^10.3 || ^11
dependencies:
  - neo:neo
  - neo_twig:neo_twig
  - neo_icon:neo_icon
  - neo_font:neo_font

neo:
  scope:
    - front
    - back
    - shared
  group: contrib
  theme:
    extend:
      spacing:
        form: 'var(--form-spacing, 0px)'
        form-item: 'var(--form-item-spacing, 1.5rem)'
        displace-t: 'var(--drupal-displace-offset-top, 0px)'
        displace-r: 'var(--drupal-displace-offset-right, 0px)'
        displace-b: 'var(--drupal-displace-offset-bottom, 0px)'
        displace-l: 'var(--drupal-displace-offset-left, 0px)'
  base:
    :root:
      --form-spacing: spacing.6
  components:
    .ui:
      '@apply font-ui': {}
    .min-h-displace:
      minHeight: 'calc(100vh - var(--drupal-displace-offset-top, 0px) - var(--drupal-displace-offset-bottom, 0px))'
    .h-displace:
      height: 'calc(100vh - var(--drupal-displace-offset-top, 0px) - var(--drupal-displace-offset-bottom, 0px))'
    .card:
      '@apply block': {}
    .form--wrapper:
      '@apply mt-form': {}
    .form--inner:
      '@apply my-form': {}
    .form-spacing-0:
      --form-spacing: 0px
    .form-label:
      '@apply block font-bold text-base-600 text-sm mb-1': {}
    .form-description:
      '@apply text-base-400 text-xs font-light mt-0.5': {}
    .form-item .description:
      '@apply form-description': {}
    .focus:
      '@apply focus:outline-none focus:ring focus:ring-primary-600 focus:ring-offset-2': {}
    .badge:
      '@apply min-w-4 rounded-2xl px-1 py-px text-center text-[10px] font-semibold': {}
    .btn:
      '@apply border-0 bg-base-500 text-base-content-500 hover:bg-base-700 hover:text-base-content-700 is-active:bg-base-700 is-active:text-base-content-700 inline-block py-2 px-4 rounded focus cursor-pointer mr-2 last:mr-0 transition': {}
    .btn-outline:
      '@apply border-2 border-base-500 bg-transparent text-base-500 py-[6px] hover:bg-base-500 hover:text-base-content-500 is-active:bg-base-500 is-active:text-base-content-500': {}
    .btn-primary:
      '@apply bg-primary-500 text-primary-content-500 hover:bg-primary-600 hover:text-primary-content-600 is-active:bg-primary-600 is-active:bg-primary-600 is-active:text-primary-content-600': {}
    .btn-primary-outline:
      '@apply border-2 border-primary-500 bg-transparent text-primary-500 py-[6px] hover:bg-primary-500 hover:text-primary-content-500 is-active:bg-primary-500 is-active:text-primary-content-500': {}
    .btn-secondary:
      '@apply bg-secondary-500 text-secondary-content-500 hover:bg-secondary-600 hover:text-secondary-content-600 is-active:bg-secondary-600 is-active:bg-secondary-600 is-active:text-secondary-content-600': {}
    .btn-secondary-outline:
      '@apply border-2 border-secondary-500 bg-transparent text-secondary-500 py-[6px] hover:bg-secondary-500 hover:text-secondary-content-500 is-active:bg-secondary-500 is-active:text-secondary-content-500': {}
    .btn-accent:
      '@apply bg-accent text-accent-content hover:bg-accent-600 hover:text-accent-content-600 is-active:bg-accent-600 is-active:bg-accent-600 is-active:text-accent-content-600': {}
    .btn-accent-outline:
      '@apply border-2 border-accent-500 bg-transparent text-accent-500 py-[6px] hover:bg-accent-500 hover:text-accent-content-500 is-active:bg-accent-500 is-active:text-accent-content-500': {}
    .btn-base:
      '@apply bg-base text-base-content hover:bg-base-700 is-active:bg-base-700': {}
    .btn-warning:
      '@apply bg-transparent text-warning hover:bg-warning-100 hover:text-warning border-0 is-active:bg-warning-100 is-active:text-warning border-0': {}
    .btn-alert:
      '@apply bg-transparent text-alert border-0 hover:bg-alert-100 hover:text-alert is-active:bg-alert-100 is-active:text-alert': {}
    .btn-text:
      '@apply bg-transparent text-inherit hover:bg-transparent hover:text-inherit hover:underline is-active:bg-transparent is-active:underline first:pl-0 last:pr-0': {}
    .btn-text-primary:
      '@apply bg-transparent text-primary-500 hover:bg-transparent hover:text-primary-700 is-active:bg-transparent is-active:text-primary-700 first:pl-0 last:pr-0': {}
    .btn-sm:
      '@apply text-sm px-3 py-2': {}
    .btn-xs:
      '@apply text-xs px-2 py-1': {}
    .btn-lg:
      '@apply text-lg': {}
    .local-action:
      '@apply btn btn-primary': {}
  variants:
    'is-active': ['&.is-active', '.is-active &']
    'is-focus': ['&.is-focus', '.is-focus &']

# libraries:
#   - neo_base/global
libraries-extend:
  core/drupal.vertical-tabs:
    - neo_base/vertical-tabs
  core/drupal.tabledrag:
    - neo_base/tabledrag
  core/drupal.dropbutton:
    - neo_base/dropbutton
  core/drupal.dialog:
    - neo_base/dialog
libraries-override:
  system/base:
    css:
      component:
        css/components/ajax-progress.module.css: false
        css/components/align.module.css: false
        css/components/autocomplete-loading.module.css: false
        css/components/fieldgroup.module.css: false
        css/components/container-inline.module.css: false
        css/components/clearfix.module.css: false
        css/components/details.module.css: false
        css/components/hidden.module.css: false
        css/components/item-list.module.css: false
        css/components/js.module.css: false
        css/components/nowrap.module.css: false
        css/components/position-container.module.css: false
        css/components/progress.module.css: false
        css/components/reset-appearance.module.css: false
        css/components/resize.module.css: false
        css/components/sticky-header.module.css: false
        css/components/system-status-counter.css: false
        css/components/system-status-report-counters.css: false
        css/components/system-status-report-general-info.css: false
        css/components/tabledrag.module.css: false
        css/components/tablesort.module.css: false
        css/components/tree-child.module.css: false
  system/admin:
    css:
      theme:
        css/system.admin.css: false
  core/drupal.dialog.off_canvas:
    css:
      theme:
        misc/dialog/off-canvas.theme.css: false
  core/drupal.dropbutton:
    css:
      component:
        misc/dropbutton/dropbutton.css: false
  core/drupal.vertical-tabs:
    css:
      component:
        misc/vertical-tabs.css: false
  core/drupal.autocomplete:
    css:
      theme:
        assets/vendor/jquery.ui/themes/theme/theme.css: false
  core/drupal.tabbingmanager:
    css:
      theme:
        assets/vendor/jquery.ui/themes/theme/theme.css: false
  core/drupal.dialog:
    css:
      component:
        assets/vendor/jquery.ui/themes/theme/dialog.css: false
      theme:
        assets/vendor/jquery.ui/themes/theme/theme.css: false
  menu_ui/drupal.menu_ui.adminforms:
    css:
      theme:
        css/menu_ui.admin.css: false
  user/drupal.user:
    css:
      component:
        css/user.module.css: false
  address/form:
    css:
      theme:
        css/address.form.css: false
