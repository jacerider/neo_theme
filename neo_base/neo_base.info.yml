name: Neo | Base
type: theme
description: 'An opinionated base theme of blessings.'
package: Neo
base theme: FALSE
version: 1.0.112
core_version_requirement: ^10.3 || ^11
dependencies:
  - neo:neo
  - neo_twig:neo_twig
  - neo_icon:neo_icon
  - neo_font:neo_font

neo:
  scope:
    - front
    - back
  group: contrib
  utilities:
    .container-center:
      apply: '@apply container mx-auto!'
    .container-content:
      apply: '@apply container-center px-container!'
    .scrollbar-none:
      -ms-overflow-style: none
      scrollbar-width: none
    .ui:
      apply: '@apply font-ui'
    .min-h-displace:
      minHeight: 'calc(100vh - var(--drupal-displace-offset-top, 0px) - var(--drupal-displace-offset-bottom, 0px))'
    .max-h-displace:
      maxHeight: 'calc(100vh - var(--drupal-displace-offset-top, 0px) - var(--drupal-displace-offset-bottom, 0px))'
    .h-displace:
      height: 'calc(100vh - var(--drupal-displace-offset-top, 0px) - var(--drupal-displace-offset-bottom, 0px))'
    .max-height-neo:
      maxHeight: 'calc(100vh - var(--drupal-displace-offset-top, 0px) - var(--drupal-displace-offset-bottom, 0px) - var(--neo-displace-offset-top, 0px) - var(--neo-displace-offset-bottom, 0px))'
    .card:
      apply: '@apply block rounded-sm border'
    .local-action:
      apply: '@apply btn btn-primary btn-xs md:btn-md'
    .badge:
      apply: '@apply min-w-4 rounded-2xl px-1 py-px text-center text-[10px] font-semibold'
    # Text reset
    .text-md:
      font-size: var(--text-md)
      line-height: 1.5rem
    .form-label:
      display: block
      marginBottom: calc(var(--spacing))
      color: 'var(--form-item-label)'
      fontSize: var(--text-sm)
      fontWeight: 700
    .form-description:
      color: 'var(--form-item-description)'
      fontSize: var(--text-xs)
      fontWeight: 300
      marginTop: calc(var(--spacing) * 0.5)
    .form-item-bg:
      backgroundColor: 'var(--form-item-base)'
      color: 'var(--form-item-content)'
      '&::placeholder':
        color: 'var(--form-item-placeholder)'
    .form-item-border-radius:
      borderRadius: 'var(--form-item-border-radius, 2px)'
    .form-item-border:
      borderColor: 'var(--form-item-border)'
      borderWidth: 'var(--form-item-border-width)'
      '&:hover':
        borderColor: 'var(--form-item-border-hover)'
      '&:focus':
        borderColor: 'var(--form-item-border-focus)'
      '&:checked,input:checked + &':
        backgroundColor: var(--form-item-primary)
        borderColor: var(--form-item-primary)
      '&:checked:focus':
        backgroundColor: var(--form-item-primary)
        borderColor: var(--form-item-primary)
      '&:checked:hover,input:checked:hover + &':
        backgroundColor: var(--form-item-primary-active)
        borderColor: var(--form-item-primary-active)
    .form-item-focus:
      '&.focus,&:focus,input:focus + &,&.selected':
        outline: 2px solid transparent
        outline-offset: 2px
        --tw-ring-offset-width: 2px
        --tw-ring-offset-shadow: 0 0 0 var(--tw-ring-offset-width) var(--form-item-base)
        --tw-ring-shadow: 0 0 0 calc(3px + var(--tw-ring-offset-width)) var(--form-item-ring)
        boxShadow: 'var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow)'
    # Page title
    .page-supertitle:
      apply: '@apply text-xl font-bold mb-2'
    .page-title:
      apply: '@apply text-3xl md:text-4xl lg:text-5xl font-bold'
    .page-subtitle:
      apply: '@apply text-lg mt-2'
    .page-title-spacing-t:
      apply: '@apply pt-10'
    .page-title-spacing-b:
      apply: '@apply mb-10'
    # Components
    .component-supertitle:
      apply: '@apply text-xl font-bold mb-2'
    .component-title:
      apply: '@apply text-2xl md:text-3xl lg:text-4xl font-bold'
    .component-subtitle:
      apply: '@apply text-sm mt-2'
  variants:
    'is-active': ['&.is-active', '.is-active &', '&.active', '.active &']
    'is-active-trail': ['&.is-active-trail', '.is-active-trail &']
    'is-focus': ['&.is-focus', '.is-focus &']
    'is-stuck': ['&.is-stuck', '.is-stuck &']
    'is-required': ['&.form-required', '.form-required &']
    'checked-prev': ['input:checked + &']
    'focus-prev': ['input:focus + &']

libraries:
  - neo_base/global
libraries-extend:
  core/drupal.vertical-tabs:
    - neo_base/vertical-tabs
  field_group/element.horizontal_tabs:
    - neo_base/horizontal-tabs
  core/drupal.tabledrag:
    - neo_base/tabledrag
  core/drupal.dropbutton:
    - neo_base/dropbutton
  neo_tooltip/dropbutton:
    - neo_base/dropbutton
  webform/webform.admin:
    - neo_base/webform
  core/drupal.dialog:
    - neo_base/dialog
  core/drupal.tableheader:
    - neo_base/tableheader
  date_recur_modular/date_recur_modular_alpha_widget:
    - neo_base/date-recur
  date_recur_modular/date_recur_modular_oscar_widget:
    - neo_base/date-recur
  date_recur_modular/date_recur_modular_sierra_widget:
    - neo_base/date-recur
