name: Neo | Base
type: theme
description: 'An opinionated base theme of blessings.'
package: Neo
base theme: FALSE
version: 0.0.0
core_version_requirement: ^10.3 || ^11
dependencies:
  - neo:neo
  - neo_twig:neo_twig
  - neo_icon:neo_icon
  - neo_font:neo_font

neo:
  scope:
    - front
    - back
    - shared
  group: contrib
  theme:
    extend:
      spacing:
        container: 'var(--container-spacing, 1rem)'
        form: 'var(--form-spacing, 0px)'
        form-item: 'var(--form-item-spacing, 1.5rem)'
        card: 'var(--form-item-spacing, 1.5rem)'
        displace-t: 'var(--drupal-displace-offset-top, 0px)'
        displace-r: 'var(--drupal-displace-offset-right, 0px)'
        displace-b: 'var(--drupal-displace-offset-bottom, 0px)'
        displace-l: 'var(--drupal-displace-offset-left, 0px)'
        neo-t: 'calc(var(--drupal-displace-offset-top, 0px) + var(--neo-displace-offset-top, 0px))'
        neo-r: 'calc(var(--drupal-displace-offset-right, 0px) + var(--neo-displace-offset-right, 0px))'
        neo-b: 'calc(var(--drupal-displace-offset-bottom, 0px) + var(--neo-displace-offset-bottom, 0px))'
        neo-l: 'calc(var(--drupal-displace-offset-left, 0px) + var(--neo-displace-offset-left, 0px))'
      colors:
        form-item-primary: var(--form-item-primary-color, rgb(var(--color-primary-500)))
        form-item-primary-content: var(--form-item-primary-content-color, rgb(var(--color-primary-content-500)))
        form-item-base: var(--form-item-base-color, rgb(var(--color-base-0)))
        form-item-base-50: var(--form-item-base-50-color, rgb(var(--color-base-50)))
        form-item-base-100: var(--form-item-base-100-color, rgb(var(--color-base-100)))
        form-item-base-200: var(--form-item-base-200-color, rgb(var(--color-base-200)))
        form-item-content: var(--form-item-content-color, rgb(var(--color-base-900)))
        form-item-label: var(--form-item-label-color, rgb(var(--color-base-600)))
        form-item-description: var(--form-item-description-color, rgb(var(--color-base-400)))
      textColor:
        default: rgb(var(--color-base-content) / <alpha-value>)
      backgroundColor:
        default: rgb(var(--color-base) / <alpha-value>)
      borderColor:
        DEFAULT: rgb(var(--color-base-300) / <alpha-value>)
  base:
    :root:
      --container-spacing: spacing.4
      --form-spacing: spacing.0
      --form-item-spacing: spacing.4
      --form-item-border-width: borderWidth.2
      --form-item-border-radius: borderRadius.DEFAULT
  components:
    .scrollbar-none:
      -ms-overflow-style: none
      scrollbar-width: none
    .text-md:
      font-size: 1rem
      line-height: 1.5rem
    .ui:
      '@apply font-ui': {}
    .min-h-displace:
      minHeight: 'calc(100vh - var(--drupal-displace-offset-top, 0px) - var(--drupal-displace-offset-bottom, 0px))'
    .max-h-displace:
      maxHeight: 'calc(100vh - var(--drupal-displace-offset-top, 0px) - var(--drupal-displace-offset-bottom, 0px))'
    .h-displace:
      height: 'calc(100vh - var(--drupal-displace-offset-top, 0px) - var(--drupal-displace-offset-bottom, 0px))'
    .max-height-neo:
      maxHeight: 'calc(100vh - var(--drupal-displace-offset-top, 0px) - var(--drupal-displace-offset-bottom, 0px) - var(--neo-displace-offset-top, 0px) - var(--neo-displace-offset-bottom, 0px))'
    .card:
      '@apply block rounded-sm border': {}
    .form--wrapper:
      '@apply mt-form': {}
    .form--inner:
      '@apply my-form modal:my-0': {}
    .form-label:
      '@apply block mb-1': {}
      color: 'var(--form-item-label-color, rgb(var(--color-base-600)))'
      fontSize: fontSize.sm
      fontWeight: fontWeight.bold
    .form-description:
      '@apply mt-0.5': {}
      color: 'var(--form-item-description-color, rgb(var(--color-base-400)))'
      fontSize: fontSize.xs
      fontWeight: fontWeight.light
    .form-item .description:
      '@apply form-description': {}
    .form-item-bg:
      backgroundColor: 'var(--form-item-base-color, rgb(var(--color-base-0)))'
      color: 'var(--form-item-color, rgb(var(--color-base-content-0)))'
      '&::placeholder':
        color: 'var(--form-item-placeholder-color, rgb(var(--color-base-700)))'
    .form-item-border-radius:
      borderRadius: 'var(--form-item-border-radius, 2px)'
    .form-item-border:
      borderColor: 'var(--form-item-border-color, rgb(var(--color-base-300)))'
      borderWidth: 'var(--form-item-border-width)'
      '&:hover':
        borderColor: 'var(--form-item-border-hover-color, rgb(var(--color-base-400)))'
      '&:focus':
        borderColor: 'var(--form-item-border-focus-color, rgb(var(--color-base-400)))'
      '&:checked':
        backgroundColor: var(--form-item-primary-color, rgb(var(--color-primary-500)))
        borderColor: var(--form-item-primary-color, rgb(var(--color-primary-500)))
      '&:checked:focus':
        backgroundColor: var(--form-item-primary-color, rgb(var(--color-primary-500)))
        borderColor: var(--form-item-primary-color, rgb(var(--color-primary-500)))
      '&:checked:hover':
        backgroundColor: var(--form-item-primary-active-color, rgb(var(--color-primary-600)))
        borderColor: var(--form-item-primary-active-color, rgb(var(--color-primary-600)))
      # '&input:focus + &':
      #   backgroundColor: var(--form-item-primary-active-color, rgb(var(--color-primary-600)))
      #   borderColor: var(--form-item-primary-active-color, rgb(var(--color-primary-600)))
    .form-item-focus:
      '&.focus,&:focus,input:focus + &':
        outline: 2px solid transparent
        outline-offset: 2px
        --tw-ring-offset-width: 2px
        --tw-ring-offset-shadow: 0 0 0 var(--tw-ring-offset-width) var(--form-item-base-color, rgb(var(--color-base-0)))
        --tw-ring-shadow: 0 0 0 calc(3px + var(--tw-ring-offset-width)) var(--form-item-ring-color, rgb(var(--color-primary-600)))
        boxShadow: 'var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow)'
    # .focus:
    #   '@apply focus:outline-none focus:ring focus:ring-primary-600 focus:ring-offset-2': {}
    .badge:
      '@apply min-w-4 rounded-2xl px-1 py-px text-center text-[10px] font-semibold': {}
    .btn:
      --btn-color: var(--form-btn-color, rgb(var(--color-base-500)))
      --btn-hover-color: var(--form-btn-hover-color, rgb(var(--color-base-700)))
      --btn-content-color: var(--form-btn-content-color, rgb(var(--color-base-content-500)))
      --btn-content-hover-color: var(--form-btn-content-hover-color, rgb(var(--color-base-content-700)))
      --btn-border-color: var(--form-btn-border-color, transparent)
      --btn-border-hover-color: var(--form-btn-border-hover-color, transparent)
      '@apply inline-block btn-md form-item-focus border-2 no-underline text-center rounded cursor-pointer transition': {}
      backgroundColor: var(--btn-color)
      borderColor: var(--btn-border-color)
      color: var(--btn-content-color)
      '&:hover':
        backgroundColor: var(--btn-hover-color)
        borderColor: var(--btn-border-hover-color)
        color: var(--btn-content-hover-color)
    .btn-outline:
      --btn-color: transparent
      --btn-hover-color: var(--form-btn-color, rgb(var(--color-base-700)))
      --btn-content-color: var(--form-btn-color, rgb(var(--color-base-500)))
      --btn-content-hover-color: var(--form-btn-content-color, rgb(var(--color-base-0)))
      --btn-border-color: var(--form-btn-color, rgb(var(--color-base-500)))
      --btn-border-hover-color: var(--form-btn-color, rgb(var(--color-base-700)))
    .btn-primary:
      --btn-color: var(--form-btn-primary-color, rgb(var(--color-primary-500)))
      --btn-hover-color: var(--form-btn-primary-hover-color, rgb(var(--color-primary-700)))
      --btn-content-color: var(--form-btn-primary-content-color, rgb(var(--color-primary-content-500)))
      --btn-content-hover-color: var(--form-btn-primary-hover-content-color, rgb(var(--color-primary-content-700)))
    .btn-primary-outline:
      --btn-color: transparent
      --btn-hover-color: var(--form-btn-primary-color, rgb(var(--color-primary-700)))
      --btn-content-color: var(--form-btn-primary-color, rgb(var(--color-primary-500)))
      --btn-content-hover-color: var(--form-btn-primary-content-color, rgb(var(--color-primary-0)))
      --btn-border-color: var(--form-btn-primary-color, rgb(var(--color-primary-500)))
      --btn-border-hover-color: var(--form-btn-primary-color, rgb(var(--color-primary-700)))
    .btn-secondary:
      --btn-color: var(--form-btn-secondary-color, rgb(var(--color-secondary-500)))
      --btn-hover-color: var(--form-btn-secondary-hover-color, rgb(var(--color-secondary-700)))
      --btn-content-color: var(--form-btn-secondary-content-color, rgb(var(--color-secondary-content-500)))
      --btn-content-hover-color: var(--form-btn-secondary-hover-content-color, rgb(var(--color-secondary-content-700)))
    .btn-secondary-outline:
      --btn-color: transparent
      --btn-hover-color: var(--form-btn-secondary-color, rgb(var(--color-secondary-700)))
      --btn-content-color: var(--form-btn-secondary-color, rgb(var(--color-secondary-500)))
      --btn-content-hover-color: var(--form-btn-secondary-content-color, rgb(var(--color-secondary-0)))
      --btn-border-color: var(--form-btn-secondary-color, rgb(var(--color-secondary-500)))
      --btn-border-hover-color: var(--form-btn-secondary-color, rgb(var(--color-secondary-700)))
    .btn-accent:
      --btn-color: var(--form-btn-accent-color, rgb(var(--color-accent-500)))
      --btn-hover-color: var(--form-btn-accent-hover-color, rgb(var(--color-accent-700)))
      --btn-content-color: var(--form-btn-accent-content-color, rgb(var(--color-accent-content-500)))
      --btn-content-hover-color: var(--form-btn-accent-hover-content-color, rgb(var(--color-accent-content-700)))
    .btn-accent-outline:
      --btn-color: transparent
      --btn-hover-color: var(--form-btn-accent-color, rgb(var(--color-accent-700)))
      --btn-content-color: var(--form-btn-accent-color, rgb(var(--color-accent-500)))
      --btn-content-hover-color: var(--form-btn-accent-content-color, rgb(var(--color-accent-0)))
      --btn-border-color: var(--form-btn-accent-color, rgb(var(--color-accent-500)))
      --btn-border-hover-color: var(--form-btn-accent-color, rgb(var(--color-accent-700)))
    .btn-success:
      --btn-color: rgb(var(--color-success-500))
      --btn-hover-color: rgb(var(--color-success-700))
      --btn-content-color: rgb(var(--color-success-content-500))
      --btn-content-hover-color: rgb(var(--color-success-content-700))
    .btn-success-outline:
      --btn-color: transparent
      --btn-hover-color: rgb(var(--color-success-700))
      --btn-content-color: rgb(var(--color-success-500))
      --btn-content-hover-color: rgb(var(--color-success-0))
      --btn-border-color: rgb(var(--color-success-500))
      --btn-border-hover-color: rgb(var(--color-success-700))
    .btn-warning:
      --btn-color: rgb(var(--color-warning-500))
      --btn-hover-color: rgb(var(--color-warning-700))
      --btn-content-color: rgb(var(--color-warning-content-500))
      --btn-content-hover-color: rgb(var(--color-warning-content-700))
    .btn-warning-outline:
      --btn-color: transparent
      --btn-hover-color: rgb(var(--color-warning-700))
      --btn-content-color: rgb(var(--color-warning-500))
      --btn-content-hover-color: rgb(var(--color-warning-0))
      --btn-border-color: rgb(var(--color-warning-500))
      --btn-border-hover-color: rgb(var(--color-warning-700))
    .btn-alert:
      --btn-color: rgb(var(--color-alert-500))
      --btn-hover-color: rgb(var(--color-alert-700))
      --btn-content-color: rgb(var(--color-alert-content-500))
      --btn-content-hover-color: rgb(var(--color-alert-content-700))
    .btn-alert-outline:
      --btn-color: transparent
      --btn-hover-color: rgb(var(--color-alert-700))
      --btn-content-color: rgb(var(--color-alert-500))
      --btn-content-hover-color: rgb(var(--color-alert-0))
      --btn-border-color: rgb(var(--color-alert-500))
      --btn-border-hover-color: rgb(var(--color-alert-700))
    .btn-text:
      --btn-color: transparent
      --btn-hover-color: transparent
      --btn-content-color: inherit
      --btn-content-hover-color: inherit
      '&:hover':
        textDecoration: underline
      '@apply first:pl-0 last:pr-0': {}
    .btn-text-primary:
      --btn-color: transparent
      --btn-hover-color: transparent
      --btn-content-color: var(--form-btn-primary-color, rgb(var(--color-primary-500)))
      --btn-content-hover-color: var(--form-btn-primary-hover-color, rgb(var(--color-primary-700)))
      --btn-border-color: transparent
      --btn-border-hover-color: transparent
      '&:hover':
        textDecoration: underline
      '@apply first:pl-0 last:pr-0': {}
    .btn-text-secondary:
      --btn-color: transparent
      --btn-hover-color: transparent
      --btn-content-color: var(--form-btn-secondary-color, rgb(var(--color-secondary-500)))
      --btn-content-hover-color: var(--form-btn-secondary-hover-color, rgb(var(--color-secondary-700)))
      --btn-border-color: transparent
      --btn-border-hover-color: transparent
      '&:hover':
        textDecoration: underline
      '@apply first:pl-0 last:pr-0': {}
    .btn-text-accent:
      --btn-color: transparent
      --btn-hover-color: transparent
      --btn-content-color: var(--form-btn-accent-color, rgb(var(--color-accent-500)))
      --btn-content-hover-color: var(--form-btn-accent-hover-color, rgb(var(--color-accent-700)))
      --btn-border-color: transparent
      --btn-border-hover-color: transparent
      '&:hover':
        textDecoration: underline
      '@apply first:pl-0 last:pr-0': {}
    .btn-text-success:
      --btn-color: transparent
      --btn-hover-color: transparent
      --btn-content-color: rgb(var(--color-success-500))
      --btn-content-hover-color: rgb(var(--color-success-700))
      --btn-border-color: transparent
      --btn-border-hover-color: transparent
      '&:hover':
        textDecoration: underline
      '@apply first:pl-0 last:pr-0': {}
    .btn-text-warning:
      --btn-color: transparent
      --btn-hover-color: transparent
      --btn-content-color: rgb(var(--color-warning-500))
      --btn-content-hover-color: rgb(var(--color-warning-700))
      --btn-border-color: transparent
      --btn-border-hover-color: transparent
      '&:hover':
        textDecoration: underline
      '@apply first:pl-0 last:pr-0': {}
    .btn-text-alert:
      --btn-color: transparent
      --btn-hover-color: transparent
      --btn-content-color: rgb(var(--color-alert-500))
      --btn-content-hover-color: rgb(var(--color-alert-700))
      --btn-border-color: transparent
      --btn-border-hover-color: transparent
      '&:hover':
        textDecoration: underline
      '@apply first:pl-0 last:pr-0': {}
    .btn-sm:
      '@apply text-sm px-3 py-1.5': {}
    .btn-xs:
      '@apply text-xs px-2 py-1': {}
    .btn-md:
      '@apply text-base py-1.5 px-4': {}
    .btn-lg:
      '@apply text-lg': {}
    .local-action:
      '@apply btn btn-primary btn-xs md:btn-md': {}
    .page-title:
      '@apply text-3xl md:text-4xl lg:text-5xl font-bold': {}
    .page-supertitle:
      '@apply text-xl font-bold md:mb-1': {}
    .page-subtitle:
      '@apply text-xl md:mt-1': {}
    .page-title-spacing-t:
      '@apply pt-10': {}
    .page-title-spacing-b:
      '@apply mb-10': {}
    .m-component-xs:
      '@apply m-2 md:m-2 lg:m-2': {}
    .m-component-sm:
      '@apply m-2 md:m-4 lg:m-6': {}
    .m-component:
      '@apply m-4 md:m-6 lg:m-14': {}
    .m-component-lg:
      '@apply m-6 md:m-14 lg:m-24': {}
    .m-component-xl:
      '@apply m-12 md:m-20 lg:m-32': {}
    .p-component-xs:
      '@apply p-2 md:p-2 lg:p-2': {}
    .p-component-sm:
      '@apply p-2 md:p-4 lg:p-6': {}
    .p-component:
      '@apply p-4 md:p-6 lg:p-14': {}
    .p-component-lg:
      '@apply p-6 md:p-14 lg:p-24': {}
    .p-component-xl:
      '@apply p-12 md:p-20 lg:p-32': {}
  variants:
    'is-active': ['&.is-active', '.is-active &']
    'is-focus': ['&.is-focus', '.is-focus &']
    'is-stuck': ['&.is-stuck', '.is-stuck &']
    'checked-prev': ['input:checked + &']
    'focus-prev': ['input:focus + &']

# libraries:
#   - neo_base/global
libraries-extend:
  core/drupal.vertical-tabs:
    - neo_base/vertical-tabs
  field_group/element.horizontal_tabs:
    - neo_base/horizontal-tabs
  core/drupal.tabledrag:
    - neo_base/tabledrag
  core/drupal.dropbutton:
    - neo_base/dropbutton
  neo_tooltip/dropbutton:
    - neo_base/dropbutton
  core/drupal.dialog:
    - neo_base/dialog
  core/drupal.tableheader:
    - neo_base/tableheader
libraries-override:
  system/base:
    css:
      component:
        css/components/ajax-progress.module.css: false
        css/components/align.module.css: false
        css/components/autocomplete-loading.module.css: false
        css/components/fieldgroup.module.css: false
        css/components/container-inline.module.css: false
        css/components/clearfix.module.css: false
        css/components/details.module.css: false
        css/components/hidden.module.css: false
        css/components/item-list.module.css: false
        css/components/js.module.css: false
        css/components/nowrap.module.css: false
        css/components/position-container.module.css: false
        css/components/progress.module.css: false
        css/components/reset-appearance.module.css: false
        css/components/resize.module.css: false
        css/components/sticky-header.module.css: false
        css/components/system-status-counter.css: false
        css/components/system-status-report-counters.css: false
        css/components/system-status-report-general-info.css: false
        css/components/tabledrag.module.css: false
        css/components/tablesort.module.css: false
        css/components/tree-child.module.css: false
  system/admin:
    css:
      theme:
        css/system.admin.css: false
  core/drupal.dialog.off_canvas:
    css:
      theme:
        misc/dialog/off-canvas.theme.css: false
  core/drupal.dropbutton:
    css:
      component:
        misc/dropbutton/dropbutton.css: false
  core/drupal.vertical-tabs:
    css:
      component:
        misc/vertical-tabs.css: false
  core/drupal.autocomplete:
    css:
      theme:
        assets/vendor/jquery.ui/themes/theme/theme.css: false
  core/drupal.tabbingmanager:
    css:
      theme:
        assets/vendor/jquery.ui/themes/theme/theme.css: false
  core/drupal.dialog:
    css:
      component:
        assets/vendor/jquery.ui/themes/theme/dialog.css: false
      theme:
        assets/vendor/jquery.ui/themes/theme/theme.css: false
  menu_ui/drupal.menu_ui.adminforms:
    css:
      theme:
        css/menu_ui.admin.css: false
  user/drupal.user:
    css:
      component:
        css/user.module.css: false
  address/form:
    css:
      theme:
        css/address.form.css: false
  field_group/element.horizontal_tabs:
    css:
      component:
        formatters/tabs/horizontal-tabs.css: false
  views_bulk_operations/frontUi:
    css:
      component:
        css/frontUi.css: false
