name: Neo | Base
type: theme
description: 'An opinionated base theme of blessings.'
package: Neo
base theme: FALSE
version: 1.0.75
core_version_requirement: ^10.3 || ^11
dependencies:
  - neo:neo
  - neo_twig:neo_twig
  - neo_icon:neo_icon
  - neo_font:neo_font

neo:
  scope:
    - front
    - back
    - shared
  group: contrib
  theme:
    extend:
      spacing:
        container: 'var(--container-spacing, 1rem)'
        form: 'var(--form-spacing, 0px)'
        form-item: 'var(--form-item-spacing, 1.5rem)'
        card: 'var(--form-item-spacing, 1.5rem)'
        displace-t: 'var(--drupal-displace-offset-top, 0px)'
        displace-r: 'var(--drupal-displace-offset-right, 0px)'
        displace-b: 'var(--drupal-displace-offset-bottom, 0px)'
        displace-l: 'var(--drupal-displace-offset-left, 0px)'
        neo-t: 'calc(var(--drupal-displace-offset-top, 0px) + var(--neo-displace-offset-top, 0px))'
        neo-r: 'calc(var(--drupal-displace-offset-right, 0px) + var(--neo-displace-offset-right, 0px))'
        neo-b: 'calc(var(--drupal-displace-offset-bottom, 0px) + var(--neo-displace-offset-bottom, 0px))'
        neo-l: 'calc(var(--drupal-displace-offset-left, 0px) + var(--neo-displace-offset-left, 0px))'
  base:
    :root:
      --container-spacing: spacing.4
      --form-spacing: spacing.0
      --form-item-spacing: spacing.4
  components:
    .text-default:
      color: 'rgb(var(--color-base-content-0) / var(--tw-text-opacity, 1))'
    .scrollbar-none:
      -ms-overflow-style: none
      scrollbar-width: none
    .text-md:
      font-size: 1rem
      line-height: 1.5rem
    .ui:
      '@apply font-ui': {}
    .min-h-displace:
      minHeight: 'calc(100vh - var(--drupal-displace-offset-top, 0px) - var(--drupal-displace-offset-bottom, 0px))'
    .max-h-displace:
      maxHeight: 'calc(100vh - var(--drupal-displace-offset-top, 0px) - var(--drupal-displace-offset-bottom, 0px))'
    .h-displace:
      height: 'calc(100vh - var(--drupal-displace-offset-top, 0px) - var(--drupal-displace-offset-bottom, 0px))'
    .max-height-neo:
      maxHeight: 'calc(100vh - var(--drupal-displace-offset-top, 0px) - var(--drupal-displace-offset-bottom, 0px) - var(--neo-displace-offset-top, 0px) - var(--neo-displace-offset-bottom, 0px))'
    .card:
      '@apply block rounded-sm border': {}
    .form--wrapper:
      '@apply mt-form': {}
    .form--inner:
      '@apply my-form modal:my-0': {}
    .form-label:
      '@apply block font-bold text-base-600 text-sm mb-1': {}
    .form-description:
      '@apply text-base-400 text-xs font-light mt-0.5': {}
    .form-item .description:
      '@apply form-description': {}
    .focus:
      '@apply focus:outline-none focus:ring focus:ring-primary-600 focus:ring-offset-2': {}
    .badge:
      '@apply min-w-4 rounded-2xl px-1 py-px text-center text-[10px] font-semibold': {}
    .btn:
      '@apply btn-md border-2 bg-base-500 border-transparent text-base-content-500 no-underline text-center rounded focus cursor-pointer transition hover:bg-base-700 hover:text-base-content-700 is-active:bg-base-700 is-active:text-base-content-700 inline-block': {}
    .btn-outline:
      '@apply border-base-500 bg-transparent text-base-500 hover:bg-base-500 hover:text-base-content-500 is-active:bg-base-500 is-active:text-base-content-500': {}
    .btn-primary:
      '@apply bg-primary-500 border-transparent text-primary-content-500 hover:bg-primary-600 hover:text-primary-content-600 is-active:bg-primary-600 is-active:bg-primary-600 is-active:text-primary-content-600': {}
    .btn-primary-outline:
      '@apply border-primary-500 bg-transparent text-primary-500 hover:bg-primary-500 hover:text-primary-content-500 is-active:bg-primary-500 is-active:text-primary-content-500': {}
    .btn-secondary:
      '@apply bg-secondary-500 border-transparent text-secondary-content-500 hover:bg-secondary-600 hover:text-secondary-content-600 is-active:bg-secondary-600 is-active:bg-secondary-600 is-active:text-secondary-content-600': {}
    .btn-secondary-outline:
      '@apply border-secondary-500 bg-transparent text-secondary-500 hover:bg-secondary-500 hover:text-secondary-content-500 is-active:bg-secondary-500 is-active:text-secondary-content-500': {}
    .btn-accent:
      '@apply bg-accent-500 border-transparent text-accent-content-500 hover:bg-accent-600 hover:text-accent-content-600 is-active:bg-accent-600 is-active:bg-accent-600 is-active:text-accent-content-600': {}
    .btn-accent-outline:
      '@apply border-accent-500 bg-transparent text-accent-500 hover:bg-accent-500 hover:text-accent-content-500 is-active:bg-accent-500 is-active:text-accent-content-500': {}
    .btn-base:
      '@apply bg-base-500 text-base-content-500 hover:bg-base-700 is-active:bg-base-700': {}
    .btn-success:
      '@apply bg-success-500 border-transparent text-success-content-500 hover:bg-success-600 hover:text-success-content-600 is-active:bg-success-600 is-active:bg-success-600 is-active:text-success-content-600': {}
    .btn-success-outline:
      '@apply border-success-500 bg-transparent text-success-500 hover:bg-success-500 hover:text-success-content-500 is-active:bg-success-500 is-active:text-success-content-500': {}
    .btn-warning:
      '@apply bg-warning-500 border-transparent text-warning-content-500 hover:bg-warning-600 hover:text-warning-content-600 is-active:bg-warning-600 is-active:bg-warning-600 is-active:text-warning-content-600': {}
    .btn-warning-outline:
      '@apply border-warning-500 bg-transparent text-warning-500 hover:bg-warning-500 hover:text-warning-content-500 is-active:bg-warning-500 is-active:text-warning-content-500': {}
    .btn-alert:
      '@apply bg-alert-500 border-transparent text-alert-content-500 hover:bg-alert-600 hover:text-alert-content-600 is-active:bg-alert-600 is-active:bg-alert-600 is-active:text-alert-content-600': {}
    .btn-alert-outline:
      '@apply border-alert-500 bg-transparent text-alert-500 hover:bg-alert-500 hover:text-alert-content-500 is-active:bg-alert-500 is-active:text-alert-content-500': {}
    .btn-text:
      '@apply bg-transparent border-transparent text-inherit hover:bg-transparent hover:text-inherit hover:underline is-active:bg-transparent is-active:underline first:pl-0 last:pr-0': {}
    .btn-text-primary:
      '@apply bg-transparent border-transparent text-primary-500 hover:bg-transparent hover:text-primary-700 is-active:bg-transparent is-active:text-primary-700 first:pl-0 last:pr-0': {}
    .btn-text-secondary:
      '@apply bg-transparent border-transparent text-secondary-500 hover:bg-transparent hover:text-secondary-700 is-active:bg-transparent is-active:text-secondary-700 first:pl-0 last:pr-0': {}
    .btn-text-success:
      '@apply bg-transparent border-transparent text-success-500 hover:bg-transparent hover:text-success-700 is-active:bg-transparent is-active:text-success-700 first:pl-0 last:pr-0': {}
    .btn-text-warning:
      '@apply bg-transparent border-transparent text-warning-500 hover:bg-transparent hover:text-warning-700 is-active:bg-transparent is-active:text-warning-700 first:pl-0 last:pr-0': {}
    .btn-text-alert:
      '@apply bg-transparent border-transparent text-alert-500 hover:bg-transparent hover:text-alert-700 is-active:bg-transparent is-active:text-alert-700 first:pl-0 last:pr-0': {}
    .btn-sm:
      '@apply text-sm px-3 py-1.5': {}
    .btn-xs:
      '@apply text-xs px-2 py-1': {}
    .btn-md:
      '@apply text-base py-1.5 px-4': {}
    .btn-lg:
      '@apply text-lg': {}
    .local-action:
      '@apply btn btn-primary btn-xs md:btn-md': {}
    .page-title:
      '@apply text-3xl md:text-4xl lg:text-5xl font-bold': {}
    .page-supertitle:
      '@apply text-xl font-bold md:mb-1': {}
    .page-subtitle:
      '@apply text-xl md:mt-1': {}
    .page-title-spacing-t:
      '@apply pt-10': {}
    .page-title-spacing-b:
      '@apply mb-10': {}
    .m-component-xs:
      '@apply m-2 md:m-2 lg:m-2': {}
    .m-component-sm:
      '@apply m-2 md:m-4 lg:m-6': {}
    .m-component:
      '@apply m-4 md:m-6 lg:m-14': {}
    .m-component-lg:
      '@apply m-6 md:m-14 lg:m-24': {}
    .m-component-xl:
      '@apply m-12 md:m-20 lg:m-32': {}
    .p-component-xs:
      '@apply p-2 md:p-2 lg:p-2': {}
    .p-component-sm:
      '@apply p-2 md:p-4 lg:p-6': {}
    .p-component:
      '@apply p-4 md:p-6 lg:p-14': {}
    .p-component-lg:
      '@apply p-6 md:p-14 lg:p-24': {}
    .p-component-xl:
      '@apply p-12 md:p-20 lg:p-32': {}
  variants:
    'is-active': ['&.is-active', '.is-active &']
    'is-focus': ['&.is-focus', '.is-focus &']
    'is-stuck': ['&.is-stuck', '.is-stuck &']
    'checked-prev': ['input:checked + &']
    'focus-prev': ['input:focus + &']

# libraries:
#   - neo_base/global
libraries-extend:
  core/drupal.vertical-tabs:
    - neo_base/vertical-tabs
  field_group/element.horizontal_tabs:
    - neo_base/horizontal-tabs
  core/drupal.tabledrag:
    - neo_base/tabledrag
  core/drupal.dropbutton:
    - neo_base/dropbutton
  neo_tooltip/dropbutton:
    - neo_base/dropbutton
  core/drupal.dialog:
    - neo_base/dialog
  core/drupal.tableheader:
    - neo_base/tableheader
libraries-override:
  system/base:
    css:
      component:
        css/components/ajax-progress.module.css: false
        css/components/align.module.css: false
        css/components/autocomplete-loading.module.css: false
        css/components/fieldgroup.module.css: false
        css/components/container-inline.module.css: false
        css/components/clearfix.module.css: false
        css/components/details.module.css: false
        css/components/hidden.module.css: false
        css/components/item-list.module.css: false
        css/components/js.module.css: false
        css/components/nowrap.module.css: false
        css/components/position-container.module.css: false
        css/components/progress.module.css: false
        css/components/reset-appearance.module.css: false
        css/components/resize.module.css: false
        css/components/sticky-header.module.css: false
        css/components/system-status-counter.css: false
        css/components/system-status-report-counters.css: false
        css/components/system-status-report-general-info.css: false
        css/components/tabledrag.module.css: false
        css/components/tablesort.module.css: false
        css/components/tree-child.module.css: false
  system/admin:
    css:
      theme:
        css/system.admin.css: false
  core/drupal.dialog.off_canvas:
    css:
      theme:
        misc/dialog/off-canvas.theme.css: false
  core/drupal.dropbutton:
    css:
      component:
        misc/dropbutton/dropbutton.css: false
  core/drupal.vertical-tabs:
    css:
      component:
        misc/vertical-tabs.css: false
  core/drupal.autocomplete:
    css:
      theme:
        assets/vendor/jquery.ui/themes/theme/theme.css: false
  core/drupal.tabbingmanager:
    css:
      theme:
        assets/vendor/jquery.ui/themes/theme/theme.css: false
  core/drupal.dialog:
    css:
      component:
        assets/vendor/jquery.ui/themes/theme/dialog.css: false
      theme:
        assets/vendor/jquery.ui/themes/theme/theme.css: false
  menu_ui/drupal.menu_ui.adminforms:
    css:
      theme:
        css/menu_ui.admin.css: false
  user/drupal.user:
    css:
      component:
        css/user.module.css: false
  address/form:
    css:
      theme:
        css/address.form.css: false
  field_group/element.horizontal_tabs:
    css:
      component:
        formatters/tabs/horizontal-tabs.css: false
  views_bulk_operations/frontUi:
    css:
      component:
        css/frontUi.css: false
