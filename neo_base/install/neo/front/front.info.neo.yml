name: Front
type: theme
description: 'A theme based on Neo | Front.'
package: Neo
base theme: neo_front
version: 1.0.0
core_version_requirement: ^10.3 || ^11
neo:
  scope: front
  components:
    .px-content:
      '@apply px-6 md:px-10 xl:px-20': {}
    .py-content:
      '@apply py-6 md:py-10 xl:py-20': {}
    .pt-content:
      '@apply pt-6 md:pt-10 xl:pt-20': {}
    .pb-content:
      '@apply pb-6 md:pb-10 xl:pb-20': {}

libraries:
  - front/global
regions:
  header: Header
  status: Status
  content: Content
  footer: Footer
