  icon: sitemap
  prefix: group
group.search_engine:
  word: search engine
  icon: tags
  prefix: group
group.meta_tags:
  word: meta tags
  icon: tags
  prefix: group
group.authoring:
  word: authoring
  icon: user
  prefix: group
group.scheduling:
