# Groups. Matched on a title's words wherever they fall, so a module's own
# phrasing ("Simple XML Sitemap", "Search engine settings") is found without
# naming the form key or field it came from.
group.menu_settings:
  word: menu settings
  icon: list-alt
  prefix: group
group.url_alias:
  word: url alias
  icon: brackets-curly
  prefix: group
group.sitemap:
