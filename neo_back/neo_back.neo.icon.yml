# Icons for form buttons and groups in the admin.
#
# NeoBackIcon looks a submit's label up under the `button` prefix, and a form's
# Cancel and Delete link's. That lookup sees these definitions and the
# unprefixed ones every module shares, never the `admin` set, which is tuned
# for menu labels ("Load more" would take its spinner).
#
# Groups (accordion items, such as the entity form sidebar's) are looked up by
# title under the `group` prefix, and only a `group` definition counts there;
# see the section at the end of this file.
#
# The glyph for a word is the one the admin toolbar and local tasks already
# use for it (neo_icon_admin), so an action looks the same in the toolbar and on
# the form. `start` matches a label that begins with the word, which a button's
# verb does, and not one that merely contains it: "Unpublish" is not "Publish".
#
# The weight puts these ahead of the unprefixed definitions, so "Save" is a
# check-square here rather than neo_icon's check-circle.
#
# A site adds or overrides a word from its own back theme, in a
# `{theme}.neo.icon.yml` carrying `prefix: button` or `prefix: group`.

button.save:
  start: save
  icon: check-square
  prefix: button
  weight: -20
button.update:
  start: update
  icon: check-square
  prefix: button
  weight: -20
button.apply:
  start: apply
  icon: check-square
  prefix: button
  weight: -20
button.publish:
