name: Neo | Backend
type: theme
description: 'An opinionated backend theme.'
package: Neo
base theme: neo_base
version: 1.1.13
core_version_requirement: ^10.3 || ^11
libraries:
  - neo_back/global

neo:
  scope: back

regions:
  status: Status
  breadcrumb: Breadcrumb
  header: Header
  content: Content
  footer: Footer

libraries-extend:
  field_ui/drupal.field_ui.manage_fields:
    - neo_back/field-ui
  views_ui/views_ui.admin:
    - neo_back/views-admin
  views_ui/views_ui.listing:
    - neo_base/table
  neo_base/form:
    - neo_back/form
  neo_base/table:
    - neo_back/table
  commerce/admin-layout:
    - neo_back/commerce-admin
  commerce/dashboard:
    - neo_back/commerce-admin
  office_hours/office_hours_widget:
    - neo_back/office-hours
  field_group/element.horizontal_tabs:
    - neo_back/horizontal-tabs

libraries-override:
  webform/webform.admin.dropbutton:
    css:
      theme:
        css/webform.admin.dropbutton.css: {}
  # Its widget rules stack the operation links (display: block) and style the
  # day labels; office-hours.css replaces both. The formatter library ships the
  # same file separately and keeps it.
  office_hours/office_hours_widget:
    css:
      theme:
        css/office_hours.css: false
