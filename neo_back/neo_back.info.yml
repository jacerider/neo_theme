name: Neo | Backend
type: theme
description: 'An opinionated backend theme.'
package: Neo
base theme: neo_base
version: 1.0.47
core_version_requirement: ^10.3 || ^11
libraries:
  - neo_back/global

neo:
  scope: back
  group: contrib
  base:
    :root:
      --form-spacing: spacing.6
  components:
    .card:
      '@apply block rounded-sm border border-base-200 bg-base-0 shadow-sm': {}
    .form--inner:
      '@apply m-form modal:m-0': {}

regions:
  status: Status
  breadcrumb: Breadcrumb
  header: Header
  content: Content
  footer: Footer

libraries-extend:
  # core/drupal.dialog.ajax:
  #   - neo_back/dialog-ajax
  field_ui/drupal.field_ui.manage_fields:
    - neo_back/field-ui
  views_ui/views_ui.admin:
    - neo_back/views-admin
  neo_base/ajax:
    - neo_back/ajax
  neo_base/dialog:
    - neo_back/dialog
  neo_base/tabledrag:
    - neo_back/tabledrag
  neo_base/dropbutton:
    - neo_back/dropbutton
  neo_base/form:
    - neo_back/form
  neo_base/media-library:
    - neo_back/media-library
  neo_base/password:
    - neo_back/password
  neo_base/progress:
    - neo_back/progress
  neo_base/table:
    - neo_back/table
  neo_base/vertical-tabs:
    - neo_back/vertical-tabs
  neo_base/horizontal-tabs:
    - neo_back/horizontal-tabs
