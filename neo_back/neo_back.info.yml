name: Neo | Backend
type: theme
description: 'An opinionated backend theme.'
package: Neo
base theme: neo_base
version: 1.0.111
core_version_requirement: ^10.3 || ^11
libraries:
  - neo_back/global

neo:
  scope: back
  utilities:
    .card:
      apply: '@apply block rounded-sm border border-base-200 bg-default shadow-sm'
    .form--inner:
      apply: '@apply m-form modal:m-0'

regions:
  status: Status
  breadcrumb: Breadcrumb
  header: Header
  content: Content
  footer: Footer

libraries-extend:
  # core/drupal.dialog.ajax:
  #   - neo_back/dialog-ajax
  field_ui/drupal.field_ui.manage_fields:
    - neo_back/field-ui
  views_ui/views_ui.admin:
    - neo_back/views-admin
  neo_base/form:
    - neo_back/form
  neo_base/table:
    - neo_back/table
  commerce/admin-layout:
    - neo_back/commerce-admin

libraries-override:
  webform/webform.admin.dropbutton:
    css:
      theme:
        css/webform.admin.dropbutton.css: {}
