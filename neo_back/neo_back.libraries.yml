global:
  version: VERSION
  neo: { scope: back }
  css:
    theme:
      src/css/base-back.css: { minified: true }
  dependencies:
    - neo_build/back
    - neo_base/displace
    - neo_base/sticky

global-utilities:
  version: VERSION
  neo:
    import: true
  css:
    theme:
      src/css/_utilities.css: { minified: true }

field-ui:
  version: VERSION
  neo: { scope: back }
  css:
    theme:
      src/css/field-ui.css: { minified: true }

views-admin:
  version: VERSION
  neo: { scope: back }
  js:
    src/js/views-admin.ts: {}
  css:
    theme:
      src/css/views-admin.css: { minified: true }
  dependencies:
    # Reached via libraries-extend on views_ui/views_ui.admin, which happens to
    # load these first. State them anyway: the chunk is invoked with
    # (jQuery, Drupal) and calls once().
    - core/jquery
    - core/drupal
    - core/once

form:
  version: VERSION
  neo: { scope: back }
  css:
    theme:
      src/css/form.css: { minified: true }

table:
  version: VERSION
  neo: { scope: back }
  css:
    theme:
      src/css/table.css: { minified: true }

commerce-admin:
  version: VERSION
  neo: { scope: back }
  css:
    theme:
      src/css/commerce-admin.css: { minified: true }

# Reached via libraries-extend on office_hours/office_hours_widget. The markup
# it styles is tagged by NeoBackOfficeHours::processSlot().
office-hours:
  version: VERSION
  neo: { scope: back }
  js:
    src/js/office-hours.ts: {}
  css:
    theme:
      src/css/office-hours.css: { minified: true }
  dependencies:
    - core/drupal
    - core/once
